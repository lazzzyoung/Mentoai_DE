name: CI Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check src tests

      - name: Ty
        run: uv run ty check src

      - name: Pytest
        run: uv run pytest -q
