services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mentoai-postgres
    environment:
      POSTGRES_USER: mentoai
      POSTGRES_PASSWORD: mentoai
      POSTGRES_DB: mentoai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentoai -d mentoai"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: mentoai-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mentoai:mentoai@postgres:5432/mentoai
      SCHEDULE_ENABLED: "true"
      EMBEDDING_CACHE_DIR: /data/models
    ports:
      - "8000:8000"
    volumes:
      - models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "mentoai migrate && mentoai seed && uvicorn mentoai.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  models:
