# Go 단일 바이너리 + 내장 SQLite: 외부 서비스 컨테이너가 없다.
# API 서버 하나만 띄우면 전체 스택이다 (시작 시 마이그레이션 자동 적용).
services:
  api:
    build: .
    container_name: mentoai-api
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /data/mentoai.db
      SCHEDULE_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - data:/data

volumes:
  data:
