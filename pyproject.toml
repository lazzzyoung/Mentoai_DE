[project]
name = "mentoai-de"
version = "0.1.0"
description = "MentoAI data engineering and RAG server project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface",
    "langchain-qdrant",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "qdrant-client>=1.9.0",
    "sentence-transformers",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    ".uv-cache",
    "infra/postgres_data",
    "infra/qdrant_storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["server", "kafka", "spark", "dags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
