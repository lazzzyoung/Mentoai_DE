[project]
name = "mentoai-de"
version = "0.1.0"
description = "MentoAI data engineering and RAG server project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg",
    "beautifulsoup4",
    "fastapi",
    "kafka-python",
    "langchain-core",
    "langchain-huggingface",
    "langchain-openai",
    "pendulum",
    "pydantic",
    "python-dotenv",
    "qdrant-client>=1.9.0",
    "requests",
    "sentence-transformers; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.10.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "poethepoet",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".uv-cache",
    "infra/postgres_data",
    "infra/qdrant_storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["server", "kafka", "spark", "dags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]

[tool.poe.tasks.install]
help = "동일한 프로젝트 가상환경(의존성 포함) 동기화"
cmd = "uv sync"

[tool.poe.tasks.format]
help = "코드 포맷 정리"
cmd = "uv run ruff format server tests"

[tool.poe.tasks.lint]
help = "정적 린트 검사"
cmd = "uv run ruff check server tests"

[tool.poe.tasks.typecheck]
help = "타입 검사"
cmd = "uv run ty check server"

[tool.poe.tasks.test]
help = "테스트 실행"
cmd = "uv run pytest"

[tool.poe.tasks.check]
help = "코드 퀄리티 전체(린트/타입/테스트) 체크"
sequence = [
  { cmd = "uv run ruff check server tests" },
  { cmd = "uv run ty check server" },
  { cmd = "uv run pytest" },
]

[tool.poe.tasks.all]
help = "전체 점검(포맷/퀄리티/저사양 코어 빌드/헬스/간편가입 검증) 수행"
sequence = [
  { ref = "format" },
  { ref = "check" },
  { ref = "preflight" },
  { ref = "docker-stop-if-running" },
  { ref = "docker-build" },
  { ref = "docker-ps" },
  { ref = "smoke-test" },
  { ref = "smoke-quick-login" },
]

[tool.poe.tasks.ci]
help = "개발-최종 점검(포맷/퀄리티)"
sequence = [
  { cmd = "uv run ruff format --check server tests" },
  { ref = "check" },
]

[tool.poe.tasks.run-server]
help = "FastAPI 서버(개발 모드) 실행"
cmd = "uv run uvicorn server.app.main:app --reload --host 0.0.0.0 --port 8000"

[tool.poe.tasks.env-init]
help = ".env 파일 생성 및 누락 키 보강(멱등)"
shell = """
bash -lc '
if [ ! -f .env.example ]; then
  echo ".env.example 파일이 없습니다."
  exit 1
fi

if [ ! -f .env ]; then
  cp .env.example .env
  echo ".env 파일을 생성했습니다."
else
  echo ".env 파일이 이미 존재합니다. 누락 키를 점검합니다."
fi

python - <<'"'"'PY'"'"'
from pathlib import Path

env_path = Path(".env")
lines = env_path.read_text().splitlines() if env_path.exists() else []
kv = {}
order = []
for line in lines:
    if not line or line.lstrip().startswith("#") or "=" not in line:
        continue
    k, v = line.split("=", 1)
    if k not in kv:
        order.append(k)
    kv[k] = v

defaults = {
    "OPENAI_API_KEY": "your_openai_api_key",
    "OPENAI_MODEL": "gpt-4o-mini",
    "KAFKA_BOOTSTRAP_SERVERS": "kafka:29092",
    "KAFKA_TOPIC_NAME": "career_raw",
    "WANTED_BASE_URL": "https://www.wanted.co.kr",
    "TARGET_JOB_GROUP": "",
    "TARGET_JOB_ID": "",
    "MINIO_ROOT_USER": "minioadmin",
    "MINIO_ROOT_PASSWORD": "minioadmin",
    "S3_ENDPOINT_URL": "http://minio:9000",
    "S3_USE_SSL": "false",
    "S3_PATH_STYLE_ACCESS": "true",
}
added = []
for k, v in defaults.items():
    if k not in kv:
        kv[k] = v
        order.append(k)
        added.append(k)

env_path.write_text("\\n".join(f"{k}={kv[k]}" for k in order) + "\\n")
if added:
    print("추가된 키:", ", ".join(added))
else:
    print("누락 키 없음")
PY
'
"""

[tool.poe.tasks.preflight]
help = "도커/환경 파일 사전 점검"
cmd = "bash -lc 'if [ ! -f .env ]; then echo \".env 파일이 필요합니다. README의 환경 변수 섹션을 먼저 설정하세요.\"; exit 1; fi; docker info >/dev/null 2>&1 || (echo \"Docker 데몬이 실행 중이어야 합니다.\" && exit 1)'"

[tool.poe.tasks.airflow-clean-pid]
help = "Airflow 웹서버 stale PID 파일 정리"
shell = """
python - <<'PY'
from pathlib import Path

pid_file = Path("airflow-webserver.pid")
if pid_file.exists():
    pid_file.unlink()
    print("airflow-webserver.pid 제거 완료")
else:
    print("airflow-webserver.pid 없음")
PY
"""

[tool.poe.tasks.docker-stop-if-running]
help = "실행 중인 인프라 컨테이너가 있으면 먼저 종료"
sequence = [
  { ref = "airflow-clean-pid" },
  { cmd = "bash -lc 'cd infra && if [ -n \"$(docker compose ps -q)\" ]; then echo \"실행 중인 컨테이너를 종료합니다.\"; docker compose down --remove-orphans; else echo \"실행 중인 컨테이너가 없습니다.\"; fi'" },
]

[tool.poe.tasks.docker-build]
help = "저사양 권장 코어 서비스만 빌드/실행(ai-server, postgres, qdrant)"
shell = """
bash -lc '
set -euo pipefail
cd infra
compose_args=(-f docker-compose.yml)
if [ -f docker-compose.tls.yml ]; then
  compose_args+=(-f docker-compose.tls.yml)
fi
docker compose "${compose_args[@]}" build --no-cache --parallel=false ai-server
docker compose "${compose_args[@]}" up -d --remove-orphans postgres qdrant ai-server
'
"""

[tool.poe.tasks.docker-up]
help = "저사양 권장 코어 서비스 실행(이미지 빌드 없이)"
shell = """
bash -lc '
set -euo pipefail
cd infra
compose_args=(-f docker-compose.yml)
if [ -f docker-compose.tls.yml ]; then
  compose_args+=(-f docker-compose.tls.yml)
fi
docker compose "${compose_args[@]}" up -d --remove-orphans postgres qdrant ai-server
'
"""

[tool.poe.tasks.docker-build-full]
help = "전체 인프라 컨테이너 빌드/실행 (고사양 권장)"
shell = """
bash -lc '
set -euo pipefail
cd infra

# Airflow 로그 권한 이슈 예방
mkdir -p ../logs/scheduler ../logs/webserver ../logs/dag_processor_manager
chmod -R 777 ../logs || true

compose_args=(-f docker-compose.yml)
if [ -f docker-compose.tls.yml ]; then
  compose_args+=(-f docker-compose.tls.yml)
fi
docker compose "${compose_args[@]}" up -d --build --remove-orphans
'
"""

[tool.poe.tasks.docker-up-full]
help = "전체 인프라 컨테이너 실행(이미지 빌드 없이, 고사양 권장)"
shell = """
bash -lc '
set -euo pipefail
cd infra

# Airflow 로그 권한 이슈 예방
mkdir -p ../logs/scheduler ../logs/webserver ../logs/dag_processor_manager
chmod -R 777 ../logs || true

compose_args=(-f docker-compose.yml)
if [ -f docker-compose.tls.yml ]; then
  compose_args+=(-f docker-compose.tls.yml)
fi
docker compose "${compose_args[@]}" up -d --remove-orphans
'
"""

[tool.poe.tasks.docker-down]
help = "인프라 컨테이너 종료"
cmd = "bash -lc 'cd infra && docker compose down --remove-orphans || true'"

[tool.poe.tasks.docker-down-volumes]
help = "볼륨 포함 종료(데이터 삭제 주의)"
cmd = "bash -lc 'cd infra && docker compose down -v --remove-orphans || true'"

[tool.poe.tasks.docker-ps]
help = "인프라 컨테이너 상태 확인"
shell = "cd infra && docker compose ps"

[tool.poe.tasks.docker-logs]
help = "인프라 로그 추적 (실행 시 종료: Ctrl+C)"
shell = "cd infra && docker compose logs -f"

[tool.poe.tasks.smoke-test]
help = "실행 확인용 API 헬스체크"
shell = """
bash -lc '
for i in {1..60}; do
  curl -kfsS https://localhost/health && exit 0
  curl -fsS http://localhost:8000/health && exit 0
  sleep 2
done
echo "서버에 아직 연결되지 않았습니다.(https://localhost 또는 http://localhost:8000)"
exit 1
'
"""

[tool.poe.tasks.smoke-quick-login]
help = "간편 로그인 API 동작 및 사용자 테이블 자동 초기화 확인"
shell = """
python - <<'PY'
import json
import ssl
import time
import urllib.error
import urllib.request

payload = {
    "user_name": "poe-smoke-user",
    "desired_job": "데이터 엔지니어",
    "career_years": 1,
    "skills": ["Python", "Spark"],
}
base_urls = ["https://localhost", "http://localhost:8000"]
for attempt in range(1, 31):
    last_error = None
    success = False
    for base in base_urls:
        try:
            request = urllib.request.Request(
                f"{base}/api/v3/auth/quick-login",
                data=json.dumps(payload).encode("utf-8"),
                headers={"Content-Type": "application/json"},
                method="POST",
            )
            kwargs = {"timeout": 20}
            if base.startswith("https://"):
                kwargs["context"] = ssl._create_unverified_context()

            with urllib.request.urlopen(request, **kwargs) as response:
                body = json.loads(response.read().decode("utf-8"))

            user_id = int(body.get("user_id", 0))
            if user_id < 1:
                raise RuntimeError("간편 로그인 응답에서 user_id를 확인하지 못했습니다.")

            print(f"quick-login ok (user_id={user_id}, url={base})")
            success = True
            break
        except (urllib.error.HTTPError, urllib.error.URLError, RuntimeError) as exc:
            last_error = exc

    if success:
        break
    if attempt == 30:
        raise SystemExit(f"quick-login 실패: {last_error}") from last_error
    time.sleep(2)
PY
"""

[tool.poe.tasks.docker-start]
help = "저사양 코어 서비스 실행 + 헬스체크 + 간편가입 스모크까지 순차 수행"
sequence = [
  { ref = "preflight" },
  { ref = "docker-stop-if-running" },
  { ref = "docker-build" },
  { ref = "docker-ps" },
  { ref = "smoke-test" },
  { ref = "smoke-quick-login" },
]

[tool.poe.tasks.docker-start-full]
help = "전체 인프라 실행 + 헬스체크 + 간편가입 스모크까지 순차 수행 (고사양 권장)"
sequence = [
  { ref = "preflight" },
  { ref = "docker-stop-if-running" },
  { ref = "docker-build-full" },
  { ref = "docker-ps" },
  { ref = "smoke-test" },
  { ref = "smoke-quick-login" },
]

[tool.poe.tasks.pipeline-stack-up]
help = "수동 파이프라인 실행용 스택(Airflow/Spark/Kafka) 기동 + qdrant 보장"
shell = """
bash -lc '
set -euo pipefail
cd infra

# Airflow 로그 권한 이슈 예방
mkdir -p ../logs/scheduler ../logs/webserver ../logs/dag_processor_manager
chmod -R 777 ../logs || true

# 1) 파이프라인 공통 의존 서비스 (+ RAG 적재용 qdrant)
docker compose up -d --remove-orphans postgres qdrant minio minio-init

# 2) Airflow DB/계정 초기화(이미 초기화된 경우 실패해도 계속)
docker compose run --rm airflow-init || true

# 3) 파이프라인 본체
docker compose up -d --remove-orphans \
  zookeeper kafka spark-master spark-worker \
  airflow-webserver airflow-scheduler
'
"""

[tool.poe.tasks.pipeline-run-manual]
help = "mentoai_pipeline DAG를 수동 1회 트리거하고 완료까지 대기"
shell = """
bash -lc '
set -euo pipefail
cd infra

AIRFLOW_BIN="/home/airflow/.local/bin/airflow"

for i in {1..30}; do
  if docker compose ps --status running --services 2>/dev/null | grep -qx 'airflow-scheduler' && \
     docker compose exec -T airflow-scheduler bash -lc "$AIRFLOW_BIN db check" >/dev/null 2>&1; then
    break
  fi
  if [ "$i" -eq 30 ]; then
    echo "airflow-scheduler 준비 타임아웃"
    docker compose ps || true
    docker compose logs --tail=120 airflow-scheduler || true
    exit 1
  fi
  sleep 2
done

RUN_ID="manual_$(date +%Y%m%d_%H%M%S)"
echo "DAG 트리거: mentoai_pipeline (run_id=$RUN_ID)"

docker compose exec -T airflow-scheduler "$AIRFLOW_BIN" dags unpause mentoai_pipeline >/dev/null
docker compose exec -T airflow-scheduler "$AIRFLOW_BIN" dags trigger mentoai_pipeline --run-id "$RUN_ID" >/dev/null

for i in {1..180}; do
  RAW_JSON=$(docker compose exec -T airflow-scheduler "$AIRFLOW_BIN" dags list-runs -d mentoai_pipeline --output json 2>/dev/null || true)
  STATE=$(printf "%s" "$RAW_JSON" | python3 - "$RUN_ID" <<'"'"'PY'"'"'
import json
import sys

run_id = sys.argv[1]
state = ""

raw = sys.stdin.read().strip()
if not raw:
    print("")
    raise SystemExit(0)

# 로그/경고가 앞에 섞일 수 있어 JSON 시작 지점부터 파싱 시도
start_candidates = [i for i in (raw.find("["), raw.find("{")) if i != -1]
if not start_candidates:
    print("")
    raise SystemExit(0)

payload = raw[min(start_candidates):]
obj = None
try:
    obj = json.loads(payload)
except json.JSONDecodeError:
    # 마지막 줄들 중 JSON 형태를 재시도
    for line in reversed(raw.splitlines()):
        line = line.strip()
        if not line or line[0] not in "[{":
            continue
        try:
            obj = json.loads(line)
            break
        except json.JSONDecodeError:
            continue

if obj is None:
    print("")
    raise SystemExit(0)

if isinstance(obj, list):
    rows = obj
elif isinstance(obj, dict):
    rows = obj.get("dag_runs") or obj.get("runs") or []
else:
    rows = []

for row in rows:
    if row.get("run_id") == run_id:
        state = (row.get("state") or "").lower()
        break

print(state)
PY
)
  if [ "$STATE" = "success" ]; then
    echo "DAG 성공: $RUN_ID"
    exit 0
  fi
  if [ "$STATE" = "failed" ]; then
    echo "DAG 실패: $RUN_ID"
    exit 1
  fi
  echo "[$i/180] DAG 상태: ${STATE:-running}"
  sleep 20
done

echo "DAG 타임아웃(60분): $RUN_ID"
exit 1
'
"""

[tool.poe.tasks.pipeline-stack-down]
help = "수동 파이프라인 실행용 스택(Airflow/Spark/Kafka) 중지/정리"
