[project]
name = "mentoai-de"
version = "0.2.0"
description = "MentoAI lightweight RAG server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.111.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "sentence-transformers; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "sqlmodel>=0.0.22",
    "torch==2.2.2+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch>=2.2,<3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a16",
    "poethepoet>=0.30.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".uv-cache",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["server", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]

[tool.poe.tasks.install]
help = "프로젝트 의존성 동기화"
cmd = "uv sync"

[tool.poe.tasks.check]
help = "코드 퀄리티 전체(린트/타입/테스트)"
sequence = [
  { cmd = "uv run ruff check server tests" },
  { cmd = "uv run ty check server" },
  { cmd = "uv run pytest" },
]

[tool.poe.tasks.run-server]
help = "FastAPI 서버 실행"
cmd = "uv run uvicorn server.app.main:app --host 0.0.0.0 --port 8000"

[tool.poe.tasks.run-scheduler]
help = "APScheduler 기반 크롤러 실행"
cmd = "uv run python -m server.app.services.scheduler_service"

[tool.poe.tasks.crawl-once]
help = "크롤러/적재 파이프라인 1회 실행"
cmd = "uv run python -m server.app.services.crawler_pipeline"

[tool.poe.tasks.env-init]
help = ".env 파일 생성 및 누락 키 보강(멱등)"
shell = """
bash -lc '
if [ ! -f .env.example ]; then
  echo ".env.example 파일이 없습니다."
  exit 1
fi

if [ ! -f .env ]; then
  cp .env.example .env
  echo ".env 파일을 생성했습니다."
else
  echo ".env 파일이 이미 존재합니다. 누락 키를 점검합니다."
fi

python - <<'"'"'PY'"'"'
from pathlib import Path

env_path = Path(".env")
lines = env_path.read_text().splitlines() if env_path.exists() else []
kv = {}
order = []
for line in lines:
    if not line or line.lstrip().startswith("#") or "=" not in line:
        continue
    k, v = line.split("=", 1)
    if k not in kv:
        order.append(k)
    kv[k] = v

defaults = {
    "OPENAI_API_KEY": "your_openai_api_key",
    "OPENAI_MODEL": "gpt-4o-mini",
    "SQLITE_DB_PATH": "./data/mentoai.db",
    "EMBEDDING_MODEL": "BM-K/KoSimCSE-roberta-multitask",
    "WANTED_BASE_URL": "https://www.wanted.co.kr",
    "TARGET_JOB_GROUP": "",
    "TARGET_JOB_ID": "",
    "CRAWLER_INTERVAL_MINUTES": "360",
    "RETRIEVAL_ALPHA": "0.45",
    "RECOMMENDATION_LIMIT": "5",
    "CANDIDATE_LIMIT": "50",
}
added = []
for k, v in defaults.items():
    if k not in kv:
        kv[k] = v
        order.append(k)
        added.append(k)

env_path.write_text("\\n".join(f"{k}={kv[k]}" for k in order) + "\\n")
if added:
    print("추가된 키:", ", ".join(added))
else:
    print("누락 키 없음")
PY
'
"""
