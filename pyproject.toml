mkdir -p ../logs/scheduler ../logs/webserver ../logs/dag_processor_manager
chmod -R 777 ../logs || true

cleanup() {
  docker compose rm -sf zookeeper kafka kafka-ui spark-master spark-worker airflow-webserver airflow-scheduler airflow-init minio minio-init || true
}
trap cleanup EXIT

docker compose up -d --remove-orphans postgres qdrant minio minio-init zookeeper kafka spark-master spark-worker
docker compose run --rm airflow-init || true
docker compose rm -sf airflow-scheduler >/dev/null 2>&1 || true
docker compose up -d --remove-orphans airflow-scheduler

for i in {1..30}; do
  if docker compose ps --status running --services 2>/dev/null | grep -qx 'airflow-scheduler' && \
     docker compose exec -T airflow-scheduler bash -lc "$AIRFLOW_BIN db check" >/dev/null 2>&1; then
    break
  fi
  if [ "$i" -eq 30 ]; then
    echo "airflow-scheduler 준비 타임아웃"
    docker compose ps || true
    docker compose logs --tail=120 airflow-scheduler || true
    exit 1
  fi
  sleep 2
done

RUN_ID="headless_$(date +%Y%m%d_%H%M%S)"
echo "DAG 트리거: mentoai_pipeline (run_id=$RUN_ID)"
docker compose exec -T airflow-scheduler bash -lc "$AIRFLOW_BIN dags unpause mentoai_pipeline" >/dev/null
docker compose exec -T airflow-scheduler bash -lc "$AIRFLOW_BIN dags trigger mentoai_pipeline --run-id $RUN_ID" >/dev/null

for i in {1..180}; do
  RAW_JSON=$(docker compose exec -T airflow-scheduler bash -lc "$AIRFLOW_BIN dags list-runs -d mentoai_pipeline --output json" 2>/dev/null || true)
  STATE=$(printf "%s" "$RAW_JSON" | python3 - "$RUN_ID" <<'"'"'PY'"'"'
import json
import sys

run_id = sys.argv[1]
state = ""

raw = sys.stdin.read().strip()
if not raw:
    print("")
    raise SystemExit(0)

# 로그/경고가 앞에 섞일 수 있어 JSON 시작 지점부터 파싱 시도
start_candidates = [i for i in (raw.find("["), raw.find("{")) if i != -1]
if not start_candidates:
    print("")
    raise SystemExit(0)

payload = raw[min(start_candidates):]
obj = None
try:
    obj = json.loads(payload)
except json.JSONDecodeError:
    # 마지막 줄들 중 JSON 형태를 재시도
    for line in reversed(raw.splitlines()):
        line = line.strip()
        if not line or line[0] not in "[{":
            continue
        try:
            obj = json.loads(line)
            break
        except json.JSONDecodeError:
            continue

if obj is None:
    print("")
    raise SystemExit(0)

if isinstance(obj, list):
    rows = obj
elif isinstance(obj, dict):
    rows = obj.get("dag_runs") or obj.get("runs") or []
else:
    rows = []

for row in rows:
    if row.get("run_id") == run_id:
        state = (row.get("state") or "").lower()
        break

print(state)
PY
)
  if [ "$STATE" = "success" ]; then
    echo "DAG 성공: $RUN_ID"
    exit 0
  fi
  if [ "$STATE" = "failed" ]; then
    echo "DAG 실패: $RUN_ID"
    exit 1
  fi
  echo "[$i/180] DAG 상태: ${STATE:-running}"
  sleep 20
done

echo "DAG 타임아웃(60분): $RUN_ID"
exit 1
'
"""

[tool.poe.tasks.collect-once]
help = "UI 없이 Kafka 수집기(producer_wanted.py) 1회 실행 후 정리"
shell = """
bash -lc '
set -euo pipefail
cd infra

if [ ! -f ../.env ]; then
  echo ".env 파일이 필요합니다. README의 환경 변수 섹션을 먼저 설정하세요."
  exit 1
fi
docker info >/dev/null 2>&1 || { echo "Docker 데몬이 실행 중이어야 합니다."; exit 1; }

cleanup() {
  docker compose rm -sf zookeeper kafka kafka-ui || true
}
trap cleanup EXIT

docker compose up -d --remove-orphans zookeeper kafka
docker compose run --rm --no-deps airflow-scheduler python3 /opt/airflow/kafka/producer_wanted.py
'
"""
